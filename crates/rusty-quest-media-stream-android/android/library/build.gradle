plugins { id "java-library" }

group = "io.github.mesmerprism.rustyquest"
version = "0.1.0"
// Standalone host execution owns its repository; the app settings supplies
// repositories when this module is included under FAIL_ON_PROJECT_REPOS.
if (rootProject.name == "rusty-quest-media-stream-android") { repositories { mavenCentral() } }
if (providers.gradleProperty("mediaBuildDir").isPresent()) {
    layout.buildDirectory = file(providers.gradleProperty("mediaBuildDir").get())
}
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

def androidJar = providers.provider {
    if (providers.gradleProperty("androidJar").isPresent()) {
        def explicit = file(providers.gradleProperty("androidJar").get())
        if (!explicit.isFile()) throw new GradleException("androidJar is not a file: ${explicit}")
        return explicit
    }
    def sdkRoot = providers.gradleProperty("android.sdk")
            .orElse(providers.environmentVariable("ANDROID_HOME"))
    def root = file(sdkRoot.get())
    def platforms = new File(root, "platforms").listFiles()
            .findAll { it.isDirectory() && it.name.startsWith("android-") }
            .sort { a, b ->
                Integer.parseInt(a.name.substring(8)) <=> Integer.parseInt(b.name.substring(8))
            }
    if (platforms.isEmpty()) throw new GradleException("No Android platform under ${root}")
    new File(platforms.last(), "android.jar")
}

dependencies {
    compileOnly files(androidJar)
    testCompileOnly files(androidJar)
    testImplementation "org.json:json:20240303"
}
tasks.withType(JavaCompile).configureEach {
    // Keep the Java 8 API/artifact contract explicit on the selected JDK.
    // All other compiler diagnostics remain strict under -Werror.
    options.release = 8
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xlint:all", "-Werror"]
}

def aarStaging = layout.buildDirectory.dir("aar-staging")
tasks.register("aarClassesJar", Jar) {
    dependsOn(tasks.named("classes"))
    from(sourceSets.main.output)
    archiveFileName = "classes.jar"
    destinationDirectory = aarStaging
}
tasks.register("bundleReleaseAar", Zip) {
    dependsOn(tasks.named("aarClassesJar"))
    from("src/main/AndroidManifest.xml") { rename { "AndroidManifest.xml" } }
    from("src/main/R.txt") { rename { "R.txt" } }
    from(tasks.named("aarClassesJar"))
    archiveFileName = "rusty-quest-media-stream-android-release.aar"
    destinationDirectory = layout.buildDirectory.dir("outputs/aar")
}
tasks.register("assembleRelease") { dependsOn(tasks.named("bundleReleaseAar")) }
// These are explicit main-based behavioral controls, not JUnit discovery.
// Desktop org.json precedes Android stubs; Android classes are type models only.
def hostSuites = [
    hostPrimitiveAdversarial: "MediaPrimitiveAdversarialMain",
    hostProtocolConformance: "MediaProtocolConformanceMain",
    hostOwnedExchangeRetention: "OwnedExchangeRetentionConformanceMain",
    hostOwnerLifecycleAdversarial: "MediaOwnerLifecycleAdversarialMain",
    hostReceiverStageTrace: "ReceiverStageTraceMain"
]
hostSuites.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        dependsOn(tasks.named("testClasses"))
        classpath = sourceSets.test.runtimeClasspath + files(androidJar)
        mainClass = "io.github.mesmerprism.rustyquest.media.${className}"
    }
}
tasks.register("hostConformance") {
    group = "verification"
    description = "Run all five explicit media host behavioral suites (Android/JNI execution excluded)."
    dependsOn(hostSuites.keySet().collect { tasks.named(it) })
}

[package]
name = "rusty-quest-peer-wire"
version = "0.1.0"
edition = "2021"
authors = ["Till Holzapfel"]
license = "AGPL-3.0-or-later"
rust-version = "1.82"
publish = false
description = "Pure lossless Quest peer renewal wire projection and restoration."

# An independent desktop closure; testing this codec must not resolve APK/render crates.
[workspace]
resolver = "2"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

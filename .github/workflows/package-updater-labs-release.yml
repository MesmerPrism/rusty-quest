name: Package Updater Labs prerelease

on:
  push:
    tags:
      - package-updater-v0.1.0-alpha.*

permissions:
  contents: write

concurrency:
  group: package-updater-labs-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 60
    environment: package-updater-labs-release
    defaults:
      run:
        working-directory: rusty-quest
    env:
      ANDROID_BUILD_TOOLS_VERSION: 35.0.1
      ANDROID_NDK_VERSION: 27.2.12479018
      GRADLE_VERSION: 8.13
      PINNED_RUST_TOOLCHAIN: 1.96.0
      RELEASE_APK_NAME: rusty-quest-package-updater.apk
      RELEASE_METADATA_NAME: rusty-quest-package-updater.release.json
      RELEASE_LICENSE_NAME: RUSTY-QUEST-PACKAGE-UPDATER-LICENSE.txt
      RELEASE_SOURCE_NAME: RUSTY-QUEST-PACKAGE-UPDATER-SOURCE.txt
    steps:
      - name: Checkout exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false
          path: rusty-quest
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: false

      - name: Checkout exact Manifold workspace dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          path: rusty-manifold
          persist-credentials: false
          ref: 947421a928889889e485006bcc0200e05c2394f9
          repository: MesmerPrism/rusty-manifold
          submodules: false

      - name: Checkout exact Lattice workspace dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          path: rusty-lattice
          persist-credentials: false
          ref: 0aee7faa52fc965ff2255381781dd082ab639f4b
          repository: MesmerPrism/rusty-lattice
          submodules: false

      - name: Checkout exact Matter workspace dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          path: rusty-matter
          persist-credentials: false
          ref: eec8cddd9830f7ef0f90574ddcbde2daac0ec804
          repository: MesmerPrism/rusty-matter
          submodules: false

      - name: Checkout exact Optics workspace dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          path: rusty-optics
          persist-credentials: false
          ref: fd01d84acffa1b0a3a192fe978af337d9fedd18a
          repository: MesmerPrism/rusty-optics
          submodules: false

      - name: Set up exact Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17.0.14+7

      - name: Set up exact Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.13
          cache-disabled: true

      - name: Install and verify pinned Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & rustup toolchain install $env:PINNED_RUST_TOOLCHAIN `
            --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust installation failed." }
          $actual = (& rustup run $env:PINNED_RUST_TOOLCHAIN rustc --version).Trim()
          if ($actual -cne "rustc 1.96.0 (ac68faa20 2026-05-25)") {
            throw "Pinned Rust compiler identity differs: $actual"
          }
          "RUSTUP_TOOLCHAIN=$env:PINNED_RUST_TOOLCHAIN" >> $env:GITHUB_ENV

      - name: Verify pre-existing exact tag and source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -cne "MesmerPrism/rusty-quest") {
            throw "Release workflow repository identity differs."
          }
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^package-updater-v0\.1\.0-alpha\.[1-9][0-9]*$') {
            throw "Release tag is outside the Package Updater Labs product."
          }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Release tag does not pre-exist." }
          $peeled = (git rev-parse "refs/tags/$tag^{}").Trim()
          if ($peeled -ne "$env:GITHUB_SHA") {
            throw "Exact tag peel differs from GITHUB_SHA."
          }
          git fetch --no-tags origin `
            "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Fresh protected main fetch failed."
          }
          git merge-base --is-ancestor `
            $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag source is not reachable from protected main."
          }
          if ((git status --porcelain).Count -ne 0) {
            throw "Release checkout is not clean."
          }

      - name: Require fresh independent release-immutability attestation
        shell: pwsh
        env:
          SETTINGS_ATTESTATION_HMAC_BASE64: ${{ secrets.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_HMAC_BASE64 }}
          SETTINGS_ATTESTATION_KEY_ID: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_KEY_ID }}
          SETTINGS_ATTESTATION_RELEASE_TAG: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_RELEASE_TAG }}
          SETTINGS_ATTESTATION_SOURCE_SHA: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_SOURCE_SHA }}
          SETTINGS_ATTESTATION_OBSERVED_AT_MS: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_OBSERVED_AT_MS }}
          SETTINGS_ATTESTATION_EXPIRES_AT_MS: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_EXPIRES_AT_MS }}
          SETTINGS_ATTESTATION_HMAC_SHA256: ${{ vars.PACKAGE_UPDATER_RELEASE_SETTINGS_ATTESTATION_HMAC_SHA256 }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REPOSITORY -cne "MesmerPrism/rusty-quest" -or
            $env:SETTINGS_ATTESTATION_KEY_ID -cne
              "release-settings-attestor-2026-a" -or
            $env:SETTINGS_ATTESTATION_RELEASE_TAG -cnotmatch
              "^package-updater-v0\.1\.0-alpha\.[1-9][0-9]*$" -or
            $env:SETTINGS_ATTESTATION_SOURCE_SHA -cnotmatch "^[0-9a-f]{40}$" -or
            $env:SETTINGS_ATTESTATION_HMAC_BASE64 -cnotmatch
              "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$" -or
            $env:SETTINGS_ATTESTATION_OBSERVED_AT_MS -cnotmatch "^[1-9][0-9]{12}$" -or
            $env:SETTINGS_ATTESTATION_EXPIRES_AT_MS -cnotmatch "^[1-9][0-9]{12}$" -or
            $env:SETTINGS_ATTESTATION_HMAC_SHA256 -cnotmatch "^[0-9a-f]{64}$") {
            throw "Release-immutability attestation inputs are noncanonical."
          }
          $observed = [int64]$env:SETTINGS_ATTESTATION_OBSERVED_AT_MS
          $expires = [int64]$env:SETTINGS_ATTESTATION_EXPIRES_AT_MS
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $maximumAge = [int64][TimeSpan]::FromMinutes(30).TotalMilliseconds
          $maximumValidity = [int64][TimeSpan]::FromHours(2).TotalMilliseconds
          if ($observed -gt $now -or $expires -le $now -or
            $now - $observed -gt $maximumAge -or
            $expires -le $observed -or $expires - $observed -gt $maximumValidity -or
            $env:SETTINGS_ATTESTATION_RELEASE_TAG -cne $env:GITHUB_REF_NAME -or
            $env:SETTINGS_ATTESTATION_SOURCE_SHA -cne $env:GITHUB_SHA) {
            throw "Release-immutability attestation is future, expired, or overlong."
          }
          $key = [Convert]::FromBase64String(
            $env:SETTINGS_ATTESTATION_HMAC_BASE64
          )
          try {
            if ($key.Length -ne 32 -or
              [Convert]::ToBase64String($key) -cne
                $env:SETTINGS_ATTESTATION_HMAC_BASE64) {
              throw "Release-immutability attestation key encoding differs."
            }
            $message = [string]::Join("`n", @(
                "rusty.quest.release_immutability_attestation.v1",
                "attestor_key_id=release-settings-attestor-2026-a",
                "repository=MesmerPrism/rusty-quest",
                "settings_api_version=2026-03-10",
                "enabled=true",
                "enforced_by_owner=false",
                "release_tag=$($env:SETTINGS_ATTESTATION_RELEASE_TAG)",
                "source_revision=$($env:SETTINGS_ATTESTATION_SOURCE_SHA)",
                "observed_at_ms=$observed",
                "expires_at_ms=$expires"
              ))
            $hmac = [Security.Cryptography.HMACSHA256]::new($key)
            try {
              $actual = $hmac.ComputeHash(
                [Text.Encoding]::UTF8.GetBytes($message)
              )
              $expected = [Convert]::FromHexString(
                $env:SETTINGS_ATTESTATION_HMAC_SHA256
              )
              if (-not [Security.Cryptography.CryptographicOperations]::FixedTimeEquals(
                  $actual,
                  $expected
                )) {
                throw "Release-immutability attestation authentication failed."
              }
            } finally {
              if ($null -ne $hmac) { $hmac.Dispose() }
              if ($null -ne $actual) {
                [Array]::Clear($actual, 0, $actual.Length)
              }
              if ($null -ne $expected) {
                [Array]::Clear($expected, 0, $expected.Length)
              }
            }
          } finally {
            [Array]::Clear($key, 0, $key.Length)
            Remove-Item Env:\SETTINGS_ATTESTATION_HMAC_BASE64 `
              -ErrorAction SilentlyContinue
          }

      - name: Install pinned Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path -LiteralPath $sdkManager -PathType Leaf)) {
            throw "Pinned sdkmanager entrypoint is unavailable."
          }
          & $sdkManager `
            "platforms;android-34" `
            "build-tools;$env:ANDROID_BUILD_TOOLS_VERSION" `
            "ndk;$env:ANDROID_NDK_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Android components failed." }

      - name: Build signed Labs product and owner metadata
        shell: pwsh
        env:
          UPDATER_KEYSTORE_BASE64: ${{ secrets.PACKAGE_UPDATER_KEYSTORE_BASE64 }}
          UPDATER_STORE_PASSWORD: ${{ secrets.PACKAGE_UPDATER_KEYSTORE_PASSWORD }}
          UPDATER_KEY_ALIAS: ${{ secrets.PACKAGE_UPDATER_KEY_ALIAS }}
          UPDATER_KEY_PASSWORD: ${{ secrets.PACKAGE_UPDATER_KEY_PASSWORD }}
          UPDATE_MANIFEST_URL: ${{ vars.PACKAGE_UPDATER_LABS_MANIFEST_URL }}
          UPDATE_KEY_ID: ${{ vars.PACKAGE_UPDATER_LABS_TRUSTED_KEY_ID }}
          UPDATE_PUBLIC_KEY: ${{ vars.PACKAGE_UPDATER_LABS_TRUSTED_PUBLIC_KEY_BASE64URL }}
          UPDATE_HTTPS_ORIGIN: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_HTTPS_ORIGIN }}
          UPDATE_SITE_BASE_PATH: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_SITE_BASE_PATH }}
          UPDATE_TARGET_PACKAGE: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_PACKAGE_NAME }}
          UPDATE_ROLLOUT_RING: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_ROLLOUT_RING }}
          UPDATE_TARGET_SIGNER: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_SIGNER_SHA256 }}
          UPDATE_UPDATER_SIGNER: ${{ vars.PACKAGE_UPDATER_LABS_EXPECTED_UPDATER_SIGNER_SHA256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $tagMatch = [regex]::Match(
            $env:GITHUB_REF_NAME,
            '^package-updater-v(?<version>0\.1\.0-alpha\.(?<sequence>[1-9][0-9]*))$'
          )
          $alphaSequence = 0
          if (-not $tagMatch.Success -or
            -not [int]::TryParse(
              $tagMatch.Groups["sequence"].Value, [ref]$alphaSequence
            ) -or $alphaSequence -lt 1) {
            throw "Release tag cannot derive a canonical Android version."
          }
          if ($env:UPDATE_MANIFEST_URL -cne
                "https://mesmerprism.com/rusty-quest/package-updates/" +
                "rusty-kiosk/labs/current.json" -or
              $env:UPDATE_HTTPS_ORIGIN -cne "https://mesmerprism.com") {
            throw "Package Updater Labs release origin is not the canonical direct endpoint."
          }
          $releaseVersion = $tagMatch.Groups["version"].Value
          $releaseRoot = Join-Path $env:RUNNER_TEMP "package-updater-release"
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          $keystore = Join-Path $env:RUNNER_TEMP "package-updater-release.jks"
          [IO.File]::WriteAllBytes(
            $keystore, [Convert]::FromBase64String($env:UPDATER_KEYSTORE_BASE64)
          )
          try {
            $gradle = (Get-Command gradle -ErrorAction Stop).Source
            $buildTools = Join-Path $env:ANDROID_SDK_ROOT `
              "build-tools\$env:ANDROID_BUILD_TOOLS_VERSION"
            $ndk = Join-Path $env:ANDROID_SDK_ROOT "ndk\$env:ANDROID_NDK_VERSION"
            $result = .\tools\Build-PackageUpdaterAndroid.ps1 `
              -GradlePath $gradle `
              -AndroidHome $env:ANDROID_SDK_ROOT `
              -AndroidBuildToolsDirectory $buildTools `
              -AndroidNdkDirectory $ndk `
              -JavaHome $env:JAVA_HOME `
              -ManifestUrl $env:UPDATE_MANIFEST_URL `
              -TrustedKeyId $env:UPDATE_KEY_ID `
              -TrustedPublicKeyBase64Url $env:UPDATE_PUBLIC_KEY `
              -ExpectedHttpsOrigin $env:UPDATE_HTTPS_ORIGIN `
              -ExpectedSiteBasePath $env:UPDATE_SITE_BASE_PATH `
              -ExpectedPackageName $env:UPDATE_TARGET_PACKAGE `
              -ExpectedRolloutRing $env:UPDATE_ROLLOUT_RING `
              -ExpectedSignerSha256 $env:UPDATE_TARGET_SIGNER `
              -ExpectedUpdaterSignerSha256 $env:UPDATE_UPDATER_SIGNER `
              -VersionCode $alphaSequence `
              -VersionName $releaseVersion `
              -KeystorePath $keystore `
              -StorePassword (ConvertTo-SecureString $env:UPDATER_STORE_PASSWORD -AsPlainText -Force) `
              -KeyAlias $env:UPDATER_KEY_ALIAS `
              -KeyPassword (ConvertTo-SecureString $env:UPDATER_KEY_PASSWORD -AsPlainText -Force) `
              -OutDir $releaseRoot
            $apk = Join-Path $releaseRoot $env:RELEASE_APK_NAME
            $buildManifest = Join-Path $releaseRoot `
              "rusty-quest-package-updater.build-manifest.json"
            $metadata = Join-Path $releaseRoot $env:RELEASE_METADATA_NAME
            .\tools\New-PackageUpdaterProductReleaseMetadata.ps1 `
              -BuildManifestPath $buildManifest -ApkPath $apk `
              -ReleaseTag $env:GITHUB_REF_NAME -RepoRoot . -OutPath $metadata
            .\tools\Test-PackageUpdaterProductReleaseMetadata.ps1 `
              -MetadataPath $metadata -BuildManifestPath $buildManifest `
              -ApkPath $apk -ReleaseTag $env:GITHUB_REF_NAME -RepoRoot .
            Copy-Item -LiteralPath .\LICENSE `
              -Destination (Join-Path $releaseRoot $env:RELEASE_LICENSE_NAME)
            $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
            if ($LASTEXITCODE -ne 0 -or
              $sourceTree -notmatch '^[0-9a-f]{40}$') {
              throw "Could not resolve the exact release source tree."
            }
            [IO.File]::WriteAllLines(
              (Join-Path $releaseRoot $env:RELEASE_SOURCE_NAME),
              @(
                "Repository: https://github.com/$env:GITHUB_REPOSITORY",
                "Tag: $env:GITHUB_REF_NAME",
                "Source revision: $env:GITHUB_SHA",
                "Source tree: $sourceTree",
                "License: AGPL-3.0-or-later"
              )
            )
            "RELEASE_ROOT=$releaseRoot" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $keystore) {
              [IO.File]::WriteAllBytes($keystore, [byte[]]::new(0))
              Remove-Item -LiteralPath $keystore -Force
            }
          }

      - name: Create draft, upload closed assets, verify, and promote
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2026-03-10"
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $tag = $env:GITHUB_REF_NAME
          function Assert-ReleaseIdentity($Release, [bool]$ExpectedDraft, [string]$Phase) {
            $releaseId = [int64]$Release.id
            $expectedReleaseUrl = "$api/releases/$releaseId"
            $expectedAssetsUrl = "$expectedReleaseUrl/assets"
            $expectedUploadUrl =
              "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/" +
              "releases/$releaseId/assets{?name,label}"
            if ($releaseId -le 0 -or $Release.tag_name -cne $tag -or
              $Release.target_commitish -cne $env:GITHUB_SHA -or
              -not $Release.prerelease -or
              $Release.draft -ne $ExpectedDraft -or
              $Release.immutable -isnot [bool] -or
              $Release.immutable -ne (-not $ExpectedDraft) -or
              $Release.url -cne $expectedReleaseUrl -or
              $Release.assets_url -cne $expectedAssetsUrl -or
              $Release.upload_url -cne $expectedUploadUrl) {
              throw "$Phase release identity differs from the exact owner tuple."
            }
            $route = $tag
            if ($ExpectedDraft) {
              $pattern = '^https://github\.com/' +
                [Regex]::Escape($env:GITHUB_REPOSITORY) +
                '/releases/tag/(?<route>untagged-[0-9a-f]{20})$'
              $match = [Regex]::Match([string]$Release.html_url, $pattern)
              if (-not $match.Success) {
                throw "$Phase draft release route is malformed."
              }
              $route = $match.Groups['route'].Value
            } elseif ($Release.html_url -cne
              "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag") {
              throw "$Phase live release route is malformed."
            }
            [pscustomobject]@{ ReleaseId = $releaseId; DownloadRoute = $route }
          }
          function Assert-ReleaseAssets(
            $RemoteAssets,
            [System.IO.FileInfo[]]$LocalAssets,
            [string]$Route,
            [string]$Phase
          ) {
            if (@($RemoteAssets).Count -ne $LocalAssets.Count) {
              throw "$Phase release asset closure is not exact."
            }
            $snapshot = @()
            $assetIds = [Collections.Generic.HashSet[long]]::new()
            foreach ($asset in $LocalAssets) {
              $name = $asset.Name
              $expectedDigest = "sha256:" + (
                Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256
              ).Hash.ToLowerInvariant()
              $remote = @($RemoteAssets | Where-Object { $_.name -ceq $name })
              $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/" +
                "releases/download/$Route/$name"
              if ($remote.Count -ne 1 -or [int64]$remote[0].id -le 0 -or
                -not $assetIds.Add([int64]$remote[0].id) -or
                $remote[0].size -ne $asset.Length -or
                $remote[0].digest -cne $expectedDigest -or
                $remote[0].state -cne "uploaded" -or
                $remote[0].browser_download_url -cne $expectedUrl) {
                throw "$Phase asset identity differs for $name."
              }
              $snapshot += "$($remote[0].id)|$name|$($asset.Length)|$expectedDigest"
            }
            @($snapshot | Sort-Object)
          }
          function Assert-RemoteTag {
            $commit = Invoke-RestMethod -Uri "$api/commits/$tag" `
              -Headers $headers
            if ($commit.sha -cne $env:GITHUB_SHA) {
              throw "Authoritative remote tag does not peel to GITHUB_SHA."
            }
          }
          function Assert-LabsIsNotLatest {
            $latestResponse = Invoke-WebRequest -Uri "$api/releases/latest" `
              -Headers $headers -SkipHttpErrorCheck
            if ($latestResponse.StatusCode -eq 404) { return }
            if ($latestResponse.StatusCode -lt 200 -or
              $latestResponse.StatusCode -ge 300) {
              throw "Latest-release readback failed with HTTP " +
                $latestResponse.StatusCode + "."
            }
            $latest = $latestResponse.Content | ConvertFrom-Json
            if ($latest.tag_name -ceq $tag) {
              throw "Package Updater Labs became the latest release."
            }
          }
          Assert-RemoteTag
          $existing = Invoke-WebRequest -Uri "$api/releases/tags/$tag" `
            -Headers $headers -SkipHttpErrorCheck
          if ($existing.StatusCode -ne 404) {
            if ($existing.StatusCode -ge 200 -and $existing.StatusCode -lt 300) {
              throw "An immutable release already exists for the exact tag."
            }
            throw "GitHub release lookup failed with HTTP $($existing.StatusCode)."
          }
          $createBody = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "Rusty Quest Package Updater $tag"
            draft = $true
            prerelease = $true
            make_latest = "false"
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$api/releases" `
            -Headers $headers -Body $createBody -ContentType "application/json"
          $draftIdentity = Assert-ReleaseIdentity `
            -Release $release -ExpectedDraft $true -Phase "Created draft"
          [System.IO.FileInfo[]]$assets = @(
            Get-Item -LiteralPath (Join-Path $env:RELEASE_ROOT $env:RELEASE_APK_NAME)
            Get-Item -LiteralPath (Join-Path $env:RELEASE_ROOT $env:RELEASE_METADATA_NAME)
            Get-Item -LiteralPath (Join-Path $env:RELEASE_ROOT $env:RELEASE_LICENSE_NAME)
            Get-Item -LiteralPath (Join-Path $env:RELEASE_ROOT $env:RELEASE_SOURCE_NAME)
          )
          foreach ($asset in $assets) {
            $name = $asset.Name
            $uploadUri = $release.upload_url.Replace("{?name,label}", "") +
              "?name=$([Uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers `
              -InFile $asset.FullName -ContentType "application/octet-stream" | Out-Null
          }
          [object[]]$remoteAssets = Invoke-RestMethod `
            -Uri "$api/releases/$($draftIdentity.ReleaseId)/assets" `
            -Headers $headers
          $draftAssets = @(Assert-ReleaseAssets `
            -RemoteAssets $remoteAssets -LocalAssets $assets `
            -Route $draftIdentity.DownloadRoute -Phase "Pre-promotion draft")
          $draftReadback = Invoke-RestMethod `
            -Uri "$api/releases/$($draftIdentity.ReleaseId)" -Headers $headers
          $draftReadbackIdentity = Assert-ReleaseIdentity `
            -Release $draftReadback -ExpectedDraft $true `
            -Phase "Pre-promotion draft"
          if ($draftReadbackIdentity.ReleaseId -ne $draftIdentity.ReleaseId) {
            throw "Draft release ID drifted before promotion."
          }
          Assert-RemoteTag
          $promoteBody = @{
            draft = $false
            prerelease = $true
            make_latest = "false"
          } | ConvertTo-Json
          $promoted = Invoke-RestMethod -Method Patch `
            -Uri "$api/releases/$($draftIdentity.ReleaseId)" -Headers $headers `
            -Body $promoteBody -ContentType "application/json"
          $promotedIdentity = Assert-ReleaseIdentity `
            -Release $promoted -ExpectedDraft $false -Phase "Promotion response"
          if ($promotedIdentity.ReleaseId -ne $draftIdentity.ReleaseId) {
            throw "Release ID drifted across promotion."
          }
          $published = Invoke-RestMethod -Uri "$api/releases/tags/$tag" `
            -Headers $headers
          $publishedIdentity = Assert-ReleaseIdentity `
            -Release $published -ExpectedDraft $false `
            -Phase "Post-promotion live"
          if ($publishedIdentity.ReleaseId -ne $draftIdentity.ReleaseId) {
            throw "Published tag route differs from the promoted release ID."
          }
          [object[]]$publishedAssets = Invoke-RestMethod `
            -Uri "$api/releases/$($publishedIdentity.ReleaseId)/assets" `
            -Headers $headers
          $liveAssets = @(Assert-ReleaseAssets `
            -RemoteAssets $publishedAssets -LocalAssets $assets `
            -Route $publishedIdentity.DownloadRoute -Phase "Post-promotion live")
          if (($draftAssets -join "`n") -cne ($liveAssets -join "`n")) {
            throw "Release asset IDs or content drifted across promotion."
          }
          Assert-RemoteTag
          Assert-LabsIsNotLatest

[package]
name = "duplex-control-lab"
version = "0.1.0"
edition = "2021"
authors = ["Till Holzapfel"]
license = "AGPL-3.0-or-later"
rust-version = "1.82"
publish = false
description = "Independent desktop consumer of the production Quest renewal wire codec."

[workspace]
resolver = "2"

[dependencies]
rusty-quest-peer-wire = { path = "../../crates/rusty-quest-peer-wire" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

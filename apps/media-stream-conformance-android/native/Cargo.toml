[package]
name = "rusty-quest-media-stream-conformance-android-native"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rusty_quest_media_stream_conformance"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusty-quest-media-stream-android = { path = "../../../crates/rusty-quest-media-stream-android" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

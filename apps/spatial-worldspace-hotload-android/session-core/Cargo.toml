[package]
name = "rusty-quest-sdk-session-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
build = "build.rs"

# Deliberately separate: no NativeActivity/renderer build script or owner.
[workspace]
[lib]
name = "rusty_quest_sdk_session_core"
crate-type = ["cdylib", "rlib"]
[dependencies]
serde_json = "1"
sha2 = "=0.10.9"
rusty-quest-breath-contract = { path = "../../../crates/rusty-quest-breath-contract" }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
[build-dependencies]
cc = "1"
